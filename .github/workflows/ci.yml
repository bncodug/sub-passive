name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.7 is the floor the README promises; 3.13 is what people run today.
        # 3.7 needs ubuntu-22.04: setup-python dropped it on 24.04 runners.
        include:
          - {python-version: "3.7", os: ubuntu-22.04}
          - {python-version: "3.9", os: ubuntu-latest}
          - {python-version: "3.11", os: ubuntu-latest}
          - {python-version: "3.13", os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the CLI starts without network access
        run: |
          python sub_passive.py --version
          python sub_passive.py --list-sources
          python sub_passive.py --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8

      - name: Lint
        run: flake8 --max-line-length=100 sub_passive.py tests/
